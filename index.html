<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Society Entry Authorization</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
<section class="card">
  <h1>Society Entry</h1>
  <p>Check flat authorization and record the number of people entering.</p>

  <form id="checkForm">
    <label for="wing">Wing</label>
    <select id="wing" required>
      <option value="">Select Wing</option>
      <option>A Wing</option><option>B Wing</option><option>C Wing</option>
      <option>D Wing</option><option>E Wing</option><option>F Wing</option>
      <option>G Wing</option><option>H Wing</option><option>I Wing</option>
      <option>J Wing</option>
    </select>

    <label for="flat">Flat Number</label>
    <input id="flat" type="text" placeholder="e.g. 101" required>

    <label for="people">People Entering Now</label>
    <input id="people" type="number" min="1" step="1" inputmode="numeric"
           placeholder="e.g. 2" required>

    <button id="authorize" type="submit">Check & Authorize</button>
  </form>

  <div id="msg" class="msg hide"></div>
  <div id="result" class="result hide"></div>

  <div class="note">
    Example: Allowed members = 4, already entered = 1, people entering now = 2.
    The app will authorize 2 and show remaining = 1.
  </div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
